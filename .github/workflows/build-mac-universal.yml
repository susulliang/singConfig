name: Build Mac Universal Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcode-select -p

    - name: Build for macOS ARM64
      run: |
        swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx12

    - name: Build for macOS x86_64
      run: |
        swift build -c release -Xswiftc -target -Xswiftc x86_64-apple-macosx12

    - name: Create Universal Binary
      run: |
        mkdir -p build/universal
        lipo -create -output build/universal/SingBoxManager \
          .build/arm64-apple-macosx/release/SingBoxManager \
          .build/x86_64-apple-macosx/release/SingBoxManager

    - name: Create Release Archive
      run: |
        mkdir -p SingBoxManager-Release
        cp build/universal/SingBoxManager SingBoxManager-Release/
        cp README.md SingBoxManager-Release/
        zip -r SingBoxManager-macOS-universal.zip SingBoxManager-Release

    - name: Upload Release Archive
      uses: actions/upload-artifact@v4
      with:
        name: SingBoxManager-macOS-universal
        path: SingBoxManager-macOS-universal.zip